name: STAC COG local raster tests

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'scripts/stac_cog_ndvi_preflight.py'
      - 'tests/test_stac_cog_ndvi_preflight.py'
      - 'tests/test_stac_cog_raster_runtime.py'
      - 'fixtures/stac-sentinel-synthetic-item.json'
      - '.github/workflows/stac-cog-runtime.yml'
  push:
    branches: [main, master]
    paths:
      - 'scripts/stac_cog_ndvi_preflight.py'
      - 'tests/test_stac_cog_ndvi_preflight.py'
      - 'tests/test_stac_cog_raster_runtime.py'
      - 'fixtures/stac-sentinel-synthetic-item.json'
      - '.github/workflows/stac-cog-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-window:
    name: Offline Rasterio band/window validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install distribution-consistent Rasterio and Numpy
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-rasterio python3-numpy
      - name: Confirm actual Rasterio runtime
        run: /usr/bin/python3 -c 'import rasterio, numpy; print(rasterio.__version__)'
      - name: Run synthetic GeoTIFF window regression suite
        env:
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          PROJ_NETWORK: "OFF"
        run: /usr/bin/python3 -m unittest discover -s tests -p 'test_stac_cog_raster_runtime.py' -v
      - name: Run offline metadata tests
        run: /usr/bin/python3 -m unittest discover -s tests -p 'test_stac_cog_ndvi_preflight.py' -v
