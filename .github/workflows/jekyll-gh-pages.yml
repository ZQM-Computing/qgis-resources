name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Assemble Pages artifact from docs/
        run: |
          set -euo pipefail
          mkdir -p site
          if [ -d docs ] && [ -n "$(ls -A docs 2>/dev/null)" ]; then
            cp -R docs/. site/
          fi
          if [ ! -f site/index.md ] && [ ! -f site/index.html ] && [ -f README.md ]; then
            cp README.md site/index.md
          fi
          echo "Pages artifact contents:"
          ls -la site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages (opt-in)
    if: github.event_name != 'pull_request' && vars.ENABLE_GITHUB_PAGES == 'true'
    needs: build
    runs-on: self-hosted
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
