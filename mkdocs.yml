site_name: QGIS Resources
site_description: QGIS resources for GIS analysts — today, a QField field-data-collection guide, with validation scripts and tests.
site_author: ZQM Computing
repo_url: https://github.com/ZQM-Computing/qgis-resources

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
